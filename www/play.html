<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#05080F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Play — Tapzens</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/assets/favicon.svg">
  <style>
    html,body{margin:0;height:100%;background:#05080F;overflow:hidden;}
  </style>
</head>
<body class="play">
  <div class="play-wrap">
    <!-- Top bar with return navigation: Home › All Games › [Game Title] -->
    <div class="play-bar">
      <a class="back" id="p-back" href="/" aria-label="Back to game detail" title="Back to game">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span class="back-label">Back</span>
      </a>
      <span class="crumb-p">
        <a href="/" class="lnk">All Games</a>
        <span class="sep">›</span>
        <span class="cur" id="p-title">Loading…</span>
      </span>
      <div class="grow"></div>
      <button class="back" id="p-fullscreen" title="Fullscreen" aria-label="Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M16 21h3a2 2 0 0 0 2-2v-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
    </div>
    <!-- Game stage -->
    <div class="play-stage" id="p-stage">
      <div class="play-loader" id="p-loader">
        <div class="spin"></div>
        <div class="lt">Loading game…</div>
      </div>
      <div class="rotate-hint" id="rotate-hint">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 6.7 3"/><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-6.7-3"/><path d="M21 3v6h-6M3 21v-6h6"/></svg>
        <div style="font-weight:600;color:#E8ECF5;font-size:15px">Rotate your device</div>
        <div style="font-size:13px" id="rotate-hint-mode">This game plays best in portrait mode.</div>
        <button class="rh-dismiss" id="rotate-dismiss" type="button">Keep playing</button>
      </div>
    </div>
  </div>
  <script src="/assets/js/player.js"></script>
</body>
</html>

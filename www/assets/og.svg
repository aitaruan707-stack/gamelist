<text x="85" y="509" fill="#F0EDFF" font-size="22">No downloads. No sign-ups. Just play.</text>
<defs><clipPath id="cat"><rect width="245" height="245" rx="47"/></clipPath><clipPath id="tile"><rect width="160" height="160" rx="30"/></clipPath></defs>
<g transform="translate(767 107) rotate(10 122 122)"><image href="covers/lihuadoku.webp" width="245" height="245" clip-path="url(#cat)"/></g>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Zupilo — free online games, instant good times">
<style>@font-face{font-family:Outfit;src:url('fonts/outfit-latin.woff2')}text{font-family:Outfit,Arial,sans-serif}</style>
<rect width="1200" height="630" fill="#F5F6FA"/>
<rect x="35" y="35" width="1130" height="560" rx="32" fill="#6254E8"/>
<image href="logo.svg" x="85" y="80" width="54" height="54"/>
<text x="151" y="120" fill="#FFFFFF" font-size="49" font-weight="700">zupilo.</text>
<text x="85" y="244" fill="#E1DCFF" font-size="16" letter-spacing="2.3">FREE ONLINE GAMES. INSTANT GOOD TIMES.</text>
<text x="80" y="332" fill="#FFFFFF" font-size="77" font-weight="600" letter-spacing="-2">A little break.</text>

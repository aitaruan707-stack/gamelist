<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Tapzens — free online games">
  <defs>
    <linearGradient id="og-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5306B"/>
      <stop offset="0.38" stop-color="#FF3B5C"/>
      <stop offset="0.72" stop-color="#FF9A2E"/>
      <stop offset="1" stop-color="#FFC400"/>
    </linearGradient>
    <linearGradient id="og-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00AC47"/>
      <stop offset="0.5" stop-color="#00BCD4"/>
      <stop offset="1" stop-color="#2196F3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#F6F5FB"/>
  <circle cx="1060" cy="70" r="190" fill="#6C5CE7" opacity="0.08"/>
  <circle cx="140" cy="580" r="210" fill="#FD79A8" opacity="0.09"/>
  <circle cx="640" cy="640" r="170" fill="#00B8A9" opacity="0.07"/>

  <!-- bold rounded T mark, 300px -->
  <g transform="translate(100,165) scale(2.34375)">
    <rect x="48" y="36" width="32" height="72" rx="16" fill="url(#og-stem)"/>
    <rect x="14" y="20" width="100" height="32" rx="16" fill="url(#og-bar)"/>
  </g>

  <text x="470" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="-2" fill="#221F3B">Tapzens</text>
  <text x="474" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="34" fill="#6E6B8A">Free online games — no download, play instantly.</text>
  <rect x="474" y="402" width="300" height="14" rx="7" fill="url(#og-bar)"/>
  <text x="474" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" font-weight="700" fill="#00B8A9">Puzzle · Action · Arcade</text>
</svg>

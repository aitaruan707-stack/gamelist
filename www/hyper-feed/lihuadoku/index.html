      var scheduleCatExpression = function () {
        if (!catStage || reduceMotion || !document.documentElement.contains(catStage)) return;
        expressionTimer = window.setTimeout(function () {
          var isBlink = Math.random() < .76;
          var className = isBlink ? 'is-blinking' : 'is-tilting';
          if (isBlink) catStage.classList.add('is-blinking');
          else catStage.classList.add('is-tilting');
          window.setTimeout(function () {
            catStage && catStage.classList.remove(className);
            scheduleCatExpression();
          }, className === 'is-blinking' ? 145 : 420);
        }, 2500 + Math.random() * 2700);
      };
      scheduleCatExpression();
      var dismiss = function () {
        if (!cover || cover.classList.contains('is-ready')) return;
        window.clearTimeout(expressionTimer);
        cover.classList.add('is-ready');
        window.setTimeout(function () { cover && cover.remove(); }, 360);
      };

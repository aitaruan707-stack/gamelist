<!-- Hidden-context fallback: HTML5 game engines (Cocos 2.x/3.x, Laya) never finish
     init when the page is hidden (embedded preview webviews, background tabs) —
     requestAnimationFrame never fires and the engine self-pauses on visibilitychange.
     We wrap rAF with a setTimeout fallback that engages whenever the page is truly
     hidden (checked at call time, so late hiding is covered), and spoof visibility
     so the engine never self-pauses. -->
<script>
(function () {
  var proto = Object.getOwnPropertyDescriptor(Document.prototype, 'hidden') ? Document.prototype : HTMLDocument.prototype;
  var hiddenGet = (Object.getOwnPropertyDescriptor(proto, 'hidden') || {}).get;
  if (!hiddenGet) return;
  var trueHidden = function () { return hiddenGet.call(document); };

  /* 1) setTimeout-driven rAF whenever truly hidden (native rAF starves there) */
  var nRAF = window.requestAnimationFrame.bind(window);
  var nCAF = window.cancelAnimationFrame.bind(window);
  var slow = {};
  window.requestAnimationFrame = function (cb) {
    if (trueHidden()) {
      var t = setTimeout(function () { delete slow[t]; cb(performance.now()); }, 16);
      slow[t] = 1;
      return t;
    }
    return nRAF(cb);
  };
  window.cancelAnimationFrame = function (id) {
    if (slow[id]) { clearTimeout(id); delete slow[id]; }
    else nCAF(id);
  };

  /* 2) spoof visibility so the engine never self-pauses */
  Object.defineProperty(document, 'hidden', { configurable: true, get: function () { return false; } });
  Object.defineProperty(document, 'visibilityState', { configurable: true, get: function () { return 'visible'; } });
  var origAdd = document.addEventListener.bind(document);
  document.addEventListener = function (type, fn, opts) {
    if (type === 'visibilitychange') return;
    return origAdd(type, fn, opts);
  };
})();
</script>

<!-- Mixed-content repair: this build points its level list, level cards and music
     preview at http://club.loveat.cn/ (config field `url` in src/project.3110c.js).
     That host has no working TLS (https:// fails the handshake), so on our HTTPS
     origin Chrome blocks those subresources as mixed content, the preloader never
     completes and the page sits on "Loading..." forever.

     The level manifest and card art (Song.json + pic/*.png, ~25KB total) are now
     mirrored under this game's own directory, because they gate startup. Music
     previews are ~1.8MB each and stay on the upstream, reached through the
     /loveat/ rewrite in vercel.json. The game's JS files are left untouched. -->
<script>
(function () {
  var ORIGIN = 'http://club.loveat.cn/';
  var MIRROR = '/hyper-feed/zombiedown/loveat/';
  var PROXY = '/loveat/';
  /* Startup-critical paths come from our own mirror; anything else (the mp3s)
     still goes to the upstream through the rewrite. */
  var MIRRORED = /^play\/DancingBlade\/(Song\.json|pic\/)/;
  function fix(u) {
    if (typeof u !== 'string' || u.indexOf(ORIGIN) !== 0) return u;
    var rest = u.slice(ORIGIN.length);
    return (MIRRORED.test(rest) ? MIRROR : PROXY) + rest;
  }

  var XO = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    var a = Array.prototype.slice.call(arguments);
    a[1] = fix(url);
    return XO.apply(this, a);
  };

  if (window.fetch) {
    var OF = window.fetch;
    window.fetch = function (req, opt) {
      if (typeof req === 'string') req = fix(req);
      return OF.call(this, req, opt);
    };
  }

  /* Cocos loads level art via new Image() and music via new Audio(), both of which
     assign through the prototype `src` setter rather than XHR. */
  ['HTMLImageElement', 'HTMLAudioElement', 'HTMLVideoElement', 'HTMLScriptElement'].forEach(function (n) {
    var C = window[n];
    if (!C) return;
    var d = Object.getOwnPropertyDescriptor(C.prototype, 'src');
    if (!d || !d.set) return;
    Object.defineProperty(C.prototype, 'src', {
      get: d.get,
      set: function (v) { d.set.call(this, fix(v)); },
      enumerable: d.enumerable,
      configurable: true
    });
  });
})();
</script>

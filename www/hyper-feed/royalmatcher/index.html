  <!-- 站点侧启动优化（维护方改）：静态标签保留（渠道审核要能扫到），但改 async ——
       实测同步标签把解析器按住 699ms，import-map 要到 DCL 之后才开始取。
       状态不能再在紧跟其后的脚本里同步断言（那时 SDK 必然还没执行完，会误判成 -1
       直接走无广告启动），改由 load / error 事件写入：0 = 未知，交给 __oppoBoot
       已有的 2500ms 轮询裁决。事件用 addEventListener 绑，不用内联 onload/onerror
       （带 CSP 的容器里内联事件属性可能被拦）。 -->
<script src="https://sdk.instgame.com/sdk/h0.js" async></script>
<script>
  window.__oppoSdkState = window.instgame ? 1 : 0;
  (function () {
    if (window.instgame) return;
    var tag = document.querySelector('script[src*="h0.js"]');
    if (!tag) { window.__oppoSdkState = -1; return; }
    tag.addEventListener('load', function () { window.__oppoSdkState = window.instgame ? 1 : -1; });
    tag.addEventListener('error', function () { window.__oppoSdkState = -1; });
  })();
  var SDK_WAIT = 2500, INIT_WAIT = 4000;
  function hasSdk() { return !!(window.instgame && typeof window.instgame.initializeAsync === "function"); }
  function bootGame(startGame) {
    if (!hasSdk()) {
      console.warn("[oppo-bridge] instgame unavailable, boot without SDK");
      return Promise.resolve().then(startGame);
    }
    // 标记已发起握手，oppoH5Bridge.ts 看到后不会重复调 initializeAsync
    window.__oppoSdkInited = true;
    // SDK 初始化失败或超时也必须启动游戏，否则永久黑屏
    var init = Promise.resolve(window.instgame.initializeAsync())
      .catch(function (e) { console.error("[oppo-bridge] initializeAsync failed", e); });
    return Promise.race([init, new Promise(function (r) { setTimeout(r, INIT_WAIT); })]).then(startGame);
  }
  window.__oppoBoot = function (startGame) {
    var t0 = Date.now();
    return new Promise(function (resolve) {
      (function poll() {
        // SDK 到位 / 明确加载失败 / 超出预算 —— 任一即放行，不留无限等待
        if (hasSdk() || window.__oppoSdkState === -1 || Date.now() - t0 > SDK_WAIT) return resolve();
        setTimeout(poll, 20);
      })();
    }).then(function () { return bootGame(startGame); });
  };
</script>

<!-- Hidden-context fallback: Cocos 3.x never finishes init when the page is hidden
     (embedded preview webviews, background tabs) — requestAnimationFrame never fires and
     the engine self-pauses on visibilitychange. We wrap rAF with a setTimeout fallback that
     engages whenever the page is truly hidden (checked at call time, so late hiding is
     covered), and spoof visibility so the engine never self-pauses. -->
<script>
(function () {
  var proto = Object.getOwnPropertyDescriptor(Document.prototype, 'hidden') ? Document.prototype : HTMLDocument.prototype;
  var hiddenGet = (Object.getOwnPropertyDescriptor(proto, 'hidden') || {}).get;
  if (!hiddenGet) return;
  var trueHidden = function () { return hiddenGet.call(document); };

  /* 1) setTimeout-driven rAF whenever truly hidden (native rAF starves there) */
  var nRAF = window.requestAnimationFrame.bind(window);
  var nCAF = window.cancelAnimationFrame.bind(window);
  var slow = {};
  window.requestAnimationFrame = function (cb) {
    if (trueHidden()) {
      var t = setTimeout(function () { delete slow[t]; cb(performance.now()); }, 16);
      slow[t] = 1;
      return t;
    }
    return nRAF(cb);
  };
  window.cancelAnimationFrame = function (id) {
    if (slow[id]) { clearTimeout(id); delete slow[id]; }
    else nCAF(id);
  };

  /* 2) spoof visibility so the engine never self-pauses */
  Object.defineProperty(document, 'hidden', { configurable: true, get: function () { return false; } });
  Object.defineProperty(document, 'visibilityState', { configurable: true, get: function () { return 'visible'; } });
  var origAdd = document.addEventListener.bind(document);
  document.addEventListener = function (type, fn, opts) {
    if (type === 'visibilitychange') return;
    return origAdd(type, fn, opts);
  };
})();
</script>

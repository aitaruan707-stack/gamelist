<html>

<head>
<!-- Hidden-context fallback: HTML5 game engines (Cocos 2.x/3.x, Laya) never finish
     init when the page is hidden (embedded preview webviews, background tabs) —
     requestAnimationFrame never fires and the engine self-pauses on visibilitychange.
     We wrap rAF with a setTimeout fallback that engages whenever the page is truly
     hidden (checked at call time, so late hiding is covered), and spoof visibility
     so the engine never self-pauses. -->
<script>
(function () {
  var proto = Object.getOwnPropertyDescriptor(Document.prototype, 'hidden') ? Document.prototype : HTMLDocument.prototype;
  var hiddenGet = (Object.getOwnPropertyDescriptor(proto, 'hidden') || {}).get;
  if (!hiddenGet) return;
  var trueHidden = function () { return hiddenGet.call(document); };

  /* 1) setTimeout-driven rAF whenever truly hidden (native rAF starves there) */
  var nRAF = window.requestAnimationFrame.bind(window);
  var nCAF = window.cancelAnimationFrame.bind(window);
  var slow = {};
  window.requestAnimationFrame = function (cb) {
    if (trueHidden()) {
      var t = setTimeout(function () { delete slow[t]; cb(performance.now()); }, 16);
      slow[t] = 1;
      return t;
    }
    return nRAF(cb);
  };
  window.cancelAnimationFrame = function (id) {
    if (slow[id]) { clearTimeout(id); delete slow[id]; }
    else nCAF(id);
  };

  /* 2) spoof visibility so the engine never self-pauses */
  Object.defineProperty(document, 'hidden', { configurable: true, get: function () { return false; } });
  Object.defineProperty(document, 'visibilityState', { configurable: true, get: function () { return 'visible'; } });
  var origAdd = document.addEventListener.bind(document);
  document.addEventListener = function (type, fn, opts) {
    if (type === 'visibilitychange') return;
    return origAdd(type, fn, opts);
  };
})();
</script>
